# Single source of truth for what a pipeline run processes.
# Change `months` and rerun; everything downstream is rebuilt per month.

months: ["2026-06", "2026-07", "2026-08"]

sources:
  trips_url_template: "https://divvy-tripdata.s3.amazonaws.com/{yyyymm}-divvy-tripdata.zip"
  gbfs_discovery_url: "https://gbfs.lyft.com/gbfs/2.3/chi/gbfs.json"
  gbfs_language: "en"
  gbfs_feeds: ["system_information", "station_information", "station_status"]

paths:
  raw_trips: "data/raw/trips"
  gbfs_snapshots: "data/snapshots/gbfs"
  warehouse: "warehouse/divvy.duckdb"
  outputs: "outputs"
  logs: "logs"

http:
  timeout_seconds: 120
  max_retries: 4
  backoff_seconds: 5

gbfs:
  # A feed older than this is treated as stale and the snapshot is rejected.
  max_feed_age_seconds: 900

validation:
  # Chicago service area. Divvy reaches Evanston (N) and the far South Side.
  bbox: {lat_min: 41.60, lat_max: 42.10, lng_min: -87.95, lng_max: -87.50}
  allowed_rideable_types: ["classic_bike", "electric_bike"]
  allowed_member_casual: ["member", "casual"]
  # Station names that are operator facilities, not customer demand.
  staff_station_pattern: "(?i)(warehouse|staff|test|repair|bike-checking)"
  # Blocking thresholds: exceeding these stops the run before any metric is written.
  max_pct_unparseable_timestamps: 0.1
  max_pct_duplicate_ride_ids: 1.0
  max_pct_file_month_mismatch: 1.0
  min_days_with_rides_pct: 100.0
  min_gbfs_docking_join_pct: 90.0

model:
  # The operational day starts at 04:00 local, the lowest-demand hour and the
  # point from which overnight rebalancing crews reset stations. Events between
  # 00:00 and 03:59 belong to the previous operational day.
  op_day_start_hour: 4
  am_peak_hours: [6, 7, 8, 9]
  pm_peak_hours: [15, 16, 17, 18]

metrics:
  # A station is "chronic" if it needs rebalancing on at least this share of its active days.
  chronic_min_share_of_days: 0.5
  # Concentration: share of required moves covered by this many top stations.
  concentration_top_n: 50
  # Rows written to outputs/rebalancing_targets.csv
  target_list_size: 50
